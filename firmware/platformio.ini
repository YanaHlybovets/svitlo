; Svitlo sensor firmware for the LilyGO T-A7670E (ESP32 + A7670E LTE modem + 18650 holder).
; Build: pio run        Flash: pio run -t upload        Logs: pio device monitor

[platformio]
default_envs = t-a7670e

[env:t-a7670e]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = default, time, esp32_exception_decoder
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DTINY_GSM_MODEM_A7670
    -DTINY_GSM_RX_BUFFER=1024
; LilyGO's TinyGSM fork (modem-built-in HTTPS), pinned to a reviewed commit.
lib_deps =
    https://github.com/lewisxhe/TinyGSM-fork.git#b1241d36befa86398200ae9ada55a96b4803f7a3
