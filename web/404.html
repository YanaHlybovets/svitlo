<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Не знайдено · Світло</title>
  <style>
    :root { color-scheme: light dark; --bg: #fffdf5; --fg: #1d1b16; --muted: #6b665c; }
    @media (prefers-color-scheme: dark) { :root { --bg: #15140f; --fg: #f3f0e6; --muted: #a49f93; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 0 16px; text-align: center; }
    a { color: inherit; }
    p { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Сторінку не знайдено</h1>
    <p><a href="/">На головну</a></p>
  </main>
</body>
</html>
