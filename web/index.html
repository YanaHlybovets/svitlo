<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf8f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16150f" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/assets/app.css">
  <title>Світло — чи є світло у вашому будинку</title>
  <meta name="description" content="Чи є світло у вашому будинку: статус у реальному часі від датчика в будинку та сповіщення в Telegram.">
  <script type="module" src="/assets/home.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/"><span aria-hidden="true">💡</span> Світло</a>
    <button id="lang-switch" class="lang" type="button">EN</button>
  </header>
  <main class="page">
    <p class="tagline" data-i18n="tagline">Чи є світло у вашому будинку — у реальному часі</p>
    <label class="search">
      <span class="visually-hidden" data-i18n="searchLabel">Пошук адреси</span>
      <input id="search" type="search" autocomplete="off" spellcheck="false" maxlength="64"
             data-i18n-placeholder="searchPlaceholder" placeholder="Вулиця й номер, наприклад «Ревуцького 54а»">
    </label>
    <div id="buildings" aria-live="polite"><p class="muted">Завантаження…</p></div>
    <p id="updated" class="muted small"></p>
  </main>
  <footer class="site-footer">
    <p data-i18n="footerSource">Дані надходять від датчика в самому будинку, а не з графіків ДТЕК.</p>
    <p><a href="https://t.me/yhLightBot" rel="noopener" data-i18n="footerBot">Сповіщення в Telegram</a> · <a href="https://github.com/YanaHlybovets/svitlo" rel="noopener" data-i18n="footerCode">Код проєкту</a></p>
  </footer>
</body>
</html>
