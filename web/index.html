<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Світло</title>
  <meta name="description" content="Чи є світло у вашому будинку: статус у реальному часі та сповіщення в Telegram.">
  <style>
    :root { color-scheme: light dark; --bg: #fffdf5; --fg: #1d1b16; --muted: #6b665c; --accent: #f2b705; }
    @media (prefers-color-scheme: dark) { :root { --bg: #15140f; --fg: #f3f0e6; --muted: #a49f93; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 0 16px; }
    main { max-width: 32rem; text-align: center; }
    h1 { font-size: 2.5rem; margin: 0 0 .5rem; }
    h1 span { color: var(--accent); }
    p { color: var(--muted); margin: .25rem 0; }
  </style>
</head>
<body>
  <main>
    <h1><span>💡</span> Світло</h1>
    <p>Чи є світло у вашому будинку — у реальному часі, зі сповіщеннями в Telegram.</p>
    <p>Сайт скоро запрацює.</p>
  </main>
</body>
</html>
